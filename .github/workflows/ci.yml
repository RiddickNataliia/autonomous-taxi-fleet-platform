name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NovaDrive/NovaDrive.slnx

      - name: Build
        run: dotnet build NovaDrive/NovaDrive.slnx --no-restore -c Release

      - name: Run unit tests
        run: dotnet test NovaDrive/NovaDrive.slnx --no-restore --filter "FullyQualifiedName~UnitTests"

      - name: Run integration tests
        run: dotnet test NovaDrive/NovaDrive.slnx --no-restore --filter "FullyQualifiedName~IntegrationTests"

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./NovaDrive
          file: ./NovaDrive/src/NovaDrive.Api/Dockerfile
          push: true
          tags: |
            nriddick/novadrive-api:latest
            nriddick/novadrive-api:${{ github.sha }}

      - name: Build and push Simulator image
        uses: docker/build-push-action@v5
        with:
          context: ./NovaDrive
          file: ./NovaDrive/simulator/Dockerfile
          push: true
          tags: |
            nriddick/novadrive-simulator:latest
            nriddick/novadrive-simulator:${{ github.sha }}