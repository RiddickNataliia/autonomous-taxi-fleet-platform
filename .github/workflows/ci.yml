name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NovaDrive/NovaDrive.slnx

      - name: Build
        run: dotnet build NovaDrive/NovaDrive.slnx --no-restore -c Release

      - name: Run unit tests
        run: dotnet test NovaDrive/NovaDrive.slnx --no-restore --filter "FullyQualifiedName~UnitTests"

      - name: Run integration tests
        run: dotnet test NovaDrive/NovaDrive.slnx --no-restore --filter "FullyQualifiedName~IntegrationTests"
